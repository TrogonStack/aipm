name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_PAT_RELEASE_PLEASE_ACTION }}
          release-type: node
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build all platforms
        run: bun run build:all

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/aipm-*/bin/*

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          artifact-name: sbom-spdx.json
          output-file: ./sbom-spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: 'dist/aipm-*/bin/*'
          sbom-path: './sbom-spdx.json'

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          cp dist/aipm-windows-x64/bin/aipm.exe release-artifacts/aipm-windows-x64.exe
          cp dist/aipm-linux-x64/bin/aipm release-artifacts/aipm-linux-x64
          cp dist/aipm-linux-arm64/bin/aipm release-artifacts/aipm-linux-arm64
          cp dist/aipm-darwin-x64/bin/aipm release-artifacts/aipm-darwin-x64
          cp dist/aipm-darwin-arm64/bin/aipm release-artifacts/aipm-darwin-arm64
          cp sbom-spdx.json release-artifacts/

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-artifacts/*
