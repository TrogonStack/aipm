name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: write
  statuses: read
  checks: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: straw-hat-team/github-actions-workflows/semantic-pull-request@master
        with:
          github-token: ${{ github.token }}
